# CUBES events for the 2026–27 year.
#
# Each event has exactly one of:
#   start: 2026-12-05T18:00:00-05:00   date and time (Montreal offset), optional `end`
#   date: "2026-12-05"                 day without a time yet, optional `endDate`
#   month: "2026-12"                   only the month so far ("Date TBA")
# Make it more precise as plans firm up.
# `tentative: true` marks events that might not happen (the "?" items).
# Upcoming vs past is computed in the visitor's browser.
#
# Fields: id, title, start | date | month, end / endDate (optional), tentative, location (optional),
#         description (optional), image (optional, path relative to this file),
#         rsvpUrl (optional), draft

