# CUBES events for the 2026–27 year.
#
# Each event has either an exact `start` (with Montreal offset, e.g.
# 2026-12-05T18:00:00-05:00) or just a `month` ("2026-12") while the date is
# still open. Swap `month` for `start` once a date is confirmed.
# `tentative: true` marks events that might not happen (the "?" items).
# Upcoming vs past is computed in the visitor's browser.
#
# Fields: id, title, start | month, end (optional), tentative, location (optional),
#         description (optional), image (optional, path relative to this file),
#         rsvpUrl (optional), draft

